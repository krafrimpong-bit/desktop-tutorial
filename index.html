<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f0">
  <title>Adspace — Find your next audience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f5f0;
      --white: #fffefa;
      --ink: #1d211c;
      --muted: #777b70;
      --line: #e8e7df;
      --lime: #d6f278;
      --green: #2d5a40;
      --coral: #e47b5d;
      --sans: "DM Sans", sans-serif;
      --display: "Space Grotesk", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; }
    button, input, select { font: inherit; }
    button { color: inherit; cursor: pointer; }
    .app { display: grid; min-height: 100vh; grid-template-columns: 238px minmax(0, 1fr); }
    .sidebar { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: #fbfaf6; padding: 27px 16px 18px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px; color: var(--ink); font: 700 20px var(--display); letter-spacing: 0; text-decoration: none; }
    .brand-mark { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 9px; background: var(--green); color: var(--lime); font-size: 16px; }
    .role-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin: 31px 0 27px; padding: 4px; border: 1px solid var(--line); border-radius: 9px; background: #f1f0e9; }
      .mobile-role-switch { display: none; }
    .role-switch button { min-height: 34px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; }
    .role-switch button.active { background: var(--white); color: var(--ink); box-shadow: 0 1px 3px #1d211c12; }
    .nav-label { padding: 0 11px; margin: 0 0 9px; color: #999b91; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    .nav { display: grid; gap: 4px; }
    .nav button { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 41px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; color: #62675e; text-align: left; font-size: 13px; font-weight: 500; }
    .nav button:hover { background: #f1f0e9; }
    .nav button.active { background: #e9eee4; color: var(--green); font-weight: 700; }
    .nav-icon { display: grid; width: 18px; place-items: center; font-size: 16px; }
    .nav-count { margin-left: auto; color: var(--muted); font-size: 11px; }
    .sidebar-bottom { margin-top: auto; }
    .help-link { display: flex; align-items: center; gap: 10px; margin: 0 7px 17px; padding: 12px 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .profile { display: flex; align-items: center; gap: 10px; padding: 13px 8px 0; border-top: 1px solid var(--line); }
    .avatar { display: grid; flex: 0 0 auto; width: 34px; height: 34px; place-items: center; border-radius: 50%; background: #ecd6bd; color: #523c2a; font-size: 11px; font-weight: 700; }
    .profile strong, .profile small { display: block; }
    .profile strong { font-size: 12px; }
    .profile small { margin-top: 2px; color: var(--muted); font-size: 10px; }
    main { min-width: 0; padding: 0 38px 56px; }
    .topbar { display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-height: 70px; border-bottom: 1px solid var(--line); }
    .icon-button { display: grid; width: 37px; height: 37px; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--white); font-size: 16px; }
    .icon-button:hover { border-color: #b8bbae; }
    .top-profile { display: flex; align-items: center; gap: 9px; margin-left: 8px; font-size: 12px; font-weight: 600; }
    .top-profile .avatar { width: 30px; height: 30px; }
    .content { width: min(1120px, 100%); margin: 0 auto; }
    .welcome { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 34px 0 25px; }
    .eyebrow { margin: 0 0 8px; color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 7px; font: 600 30px/1.1 var(--display); letter-spacing: 0; }
    .welcome p:last-child { margin-bottom: 0; color: var(--muted); font-size: 13px; }
    .primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 15px; border: 0; border-radius: 7px; background: var(--green); color: white; font-size: 12px; font-weight: 700; transition: background .15s, transform .15s; }
    .primary:hover { transform: translateY(-1px); background: #224a33; }
    .primary .plus { color: var(--lime); font-size: 17px; line-height: 0; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 28px; }
    .stat { min-height: 103px; padding: 17px 18px; border: 1px solid var(--line); border-radius: 9px; background: var(--white); }
    .stat-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; }
    .stat-icon { color: var(--green); font-size: 15px; }
    .stat strong { display: inline-block; margin-top: 13px; font: 600 24px/1 var(--display); }
    .stat .change { margin-left: 7px; color: #488251; font-size: 10px; font-weight: 700; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 15px; }
    .section-heading h2 { margin: 0; font: 600 19px var(--display); }
    .section-heading .sub { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .text-button { padding: 6px 0; border: 0; background: transparent; color: var(--green); font-size: 11px; font-weight: 700; }
    .filters { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
    .search { position: relative; flex: 1; min-width: 130px; }
    .search span { position: absolute; top: 50%; left: 12px; transform: translateY(-50%); color: #8c9085; }
    .search input, .filters select { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 7px; outline: none; background: var(--white); color: var(--ink); font-size: 11px; }
    .search input { padding: 0 12px 0 34px; }
    .filters select { width: auto; min-width: 126px; padding: 0 29px 0 10px; }
    .search input:focus, .filters select:focus, .field input:focus, .field select:focus { border-color: #75927a; box-shadow: 0 0 0 3px #2d5a4012; }
    .category-row { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 13px; scrollbar-width: none; }
    .category-row::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; min-height: 29px; padding: 0 11px; border: 1px solid var(--line); border-radius: 99px; background: transparent; color: #676b62; font-size: 10px; font-weight: 600; }
    .chip:hover, .chip.active { border-color: var(--green); background: var(--green); color: white; }
    .listing-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .listing { overflow: hidden; border: 1px solid var(--line); border-radius: 9px; background: var(--white); transition: transform .18s, box-shadow .18s; }
    .listing:hover { transform: translateY(-2px); box-shadow: 0 8px 22px #1d211c0c; }
    .listing-image { position: relative; height: 145px; overflow: hidden; background: #e4e6d9; }
    .listing-image img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
    .listing:hover .listing-image img { transform: scale(1.035); }
    .tag { position: absolute; top: 10px; left: 10px; padding: 5px 8px; border-radius: 4px; background: #fffefaed; color: var(--ink); font-size: 9px; font-weight: 700; }
    .save { position: absolute; top: 9px; right: 9px; display: grid; width: 29px; height: 29px; place-items: center; border: 0; border-radius: 50%; background: #fffefaed; color: #686d62; font-size: 16px; }
    .save.saved { color: #bf634a; }
    .listing-body { padding: 13px 14px 12px; }
    .publisher { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 10px; }
    .publisher .avatar { width: 21px; height: 21px; font-size: 8px; }
    .listing h3 { margin: 10px 0 5px; font: 600 15px var(--display); }
    .listing-desc { overflow: hidden; margin: 0; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .listing-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; padding-top: 11px; border-top: 1px solid #eeede7; }
    .listing-meta small { display: block; color: var(--muted); font-size: 9px; }
    .listing-meta strong { display: block; margin-top: 3px; font: 600 13px var(--display); }
    .listing-meta .audience { text-align: right; }
    .listing-meta .audience strong { font: 600 11px var(--sans); }
    .empty { grid-column: 1/-1; padding: 34px; border: 1px dashed #d8d9d0; border-radius: 9px; color: var(--muted); text-align: center; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 3; padding: 12px 16px; border-radius: 7px; background: var(--ink); color: white; font-size: 12px; box-shadow: 0 8px 25px #0002; animation: enter .2s ease-out; }
    @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .modal-backdrop { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 18px; background: #161a16a6; }
    .modal { width: min(440px, 100%); padding: 25px; border-radius: 10px; background: var(--white); box-shadow: 0 20px 70px #0003; animation: enter .18s ease-out; }
    .modal-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 19px; }
    .modal-head h2 { margin: 0; font: 600 21px var(--display); }
    .modal-head p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .close { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: transparent; }
    .field { display: grid; gap: 6px; margin: 13px 0; }
    .field label { color: #53584f; font-size: 11px; font-weight: 700; }
    .field input, .field select { width: 100%; height: 39px; padding: 0 11px; border: 1px solid var(--line); border-radius: 6px; outline: 0; background: white; font-size: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 21px; }
    .secondary { min-height: 39px; padding: 0 14px; border: 1px solid var(--line); border-radius: 7px; background: transparent; font-size: 11px; font-weight: 600; }
    @media (max-width: 1050px) { main { padding-right: 25px; padding-left: 25px; } .listing-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; padding-bottom: 62px; }
      .sidebar { position: fixed; right: 0; bottom: 0; left: 0; z-index: 4; display: flex; height: 60px; padding: 5px 8px; border-top: 1px solid var(--line); border-right: 0; background: #fbfaf6f5; }
      .brand, .sidebar .role-switch, .nav-label, .sidebar-bottom { display: none; }
      .mobile-role-switch { display: grid; width: 172px; margin: 0; }
      .mobile-role-switch button { min-height: 31px; }
      .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; width: 100%; }
      .nav button { flex-direction: column; justify-content: center; gap: 2px; min-height: 48px; padding: 3px; font-size: 9px; }
      .nav-icon { font-size: 17px; }
      .nav-count { display: none; }
      main { padding: 0 17px 35px; }
      .topbar { min-height: 57px; }
      .welcome { align-items: flex-start; padding: 24px 0 20px; }
      h1 { font-size: 25px; }
      .welcome .primary { min-height: 36px; padding: 0 10px; font-size: 10px; white-space: nowrap; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 25px; }
      .stat { min-height: 88px; padding: 13px; }
      .stat strong { margin-top: 11px; font-size: 21px; }
      .filters { flex-wrap: wrap; }
      .search { flex-basis: 100%; }
      .filters select { flex: 1; }
      .listing-grid { gap: 9px; }
      .listing-image { height: 116px; }
      .listing-body { padding: 11px; }
      .listing h3 { font-size: 13px; }
      .listing-desc { font-size: 9px; }
      .listing-meta strong { font-size: 11px; }
      .listing-meta .audience strong { font-size: 10px; }
    }
    @media (max-width: 380px) { .listing-grid { grid-template-columns: 1fr; } .listing-image { height: 155px; } .welcome { gap: 8px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Adspace home"><span class="brand-mark">a.</span> adspace</a>
      <div class="role-switch" role="group" aria-label="Workspace">
        <button class="active" data-role="buyer">Buyer</button>
        <button data-role="seller">Seller</button>
      </div>
      <p class="nav-label">Workspace</p>
      <nav class="nav" aria-label="Main navigation">
        <button class="active" data-page="Discover"><span class="nav-icon">⌕</span><span>Discover</span></button>
        <button data-page="Campaigns"><span class="nav-icon">▤</span><span>Campaigns</span><span class="nav-count">3</span></button>
        <button data-page="Saved"><span class="nav-icon">♡</span><span>Saved</span></button>
        <button data-page="Analytics"><span class="nav-icon">⌁</span><span>Analytics</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-link"><span>ⓘ</span> Help &amp; support</div>
        <div class="profile"><span class="avatar">JM</span><span><strong>Jordan Miller</strong><small>jordan@studio.co</small></span></div>
      </div>
    </aside>
    <main>
      <div class="topbar">
        <div class="role-switch mobile-role-switch" role="group" aria-label="Workspace">
          <button class="active" data-role="buyer">Buyer</button>
          <button data-role="seller">Seller</button>
        </div>
        <button class="icon-button" aria-label="Notifications" title="Notifications">♧</button>
        <div class="top-profile"><span class="avatar">JM</span><span>Jordan Miller</span></div>
      </div>
      <div class="content">
        <header class="welcome">
          <div><p class="eyebrow" id="welcome-kicker">MONDAY, OCTOBER 19</p><h1 id="welcome-title">Find your next audience.</h1><p id="welcome-copy">Thoughtful placements for brands with something to say.</p></div>
          <button class="primary" id="primary-action"><span class="plus">+</span><span>New campaign</span></button>
        </header>
        <section class="stats" aria-label="Workspace overview" id="stats"></section>
        <section>
          <div class="section-heading"><div><h2 id="section-title">Spaces worth your spend</h2><p class="sub" id="section-sub">Independent publishers, real communities, clear pricing.</p></div><button class="text-button" id="view-all">View all placements →</button></div>
          <div class="filters">
            <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search publications, audiences..." aria-label="Search placements"></label>
            <select id="sort" aria-label="Sort placements"><option value="recommended">Recommended</option><option value="price-low">Price: low to high</option><option value="audience-high">Largest audience</option></select>
            <select id="format" aria-label="Filter by format"><option value="all">All formats</option><option>Newsletter</option><option>Podcast</option><option>Website</option><option>Social</option><option>Magazine</option></select>
          </div>
          <div class="category-row" id="categories" aria-label="Filter by category"></div>
          <div class="listing-grid" id="listings" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>
  <div id="overlay-root"></div>
  <script>
    const placements = [
      { name: "The Daily Pour", publisher: "Good Things Media", initials: "GT", category: "Food & Drink", format: "Newsletter", price: 480, audience: "42k", detail: "Weekly reads for people who take their coffee seriously.", image: "photo-1495474472287-4d71bcdd2085", tone: "#d8c5a5" },
      { name: "Offscreen", publisher: "Offscreen Studio", initials: "OS", category: "Design", format: "Magazine", price: 1250, audience: "18k", detail: "An independent print magazine for creative thinkers.", image: "photo-1497366754035-f200968a6e72", tone: "#d8e2d5" },
      { name: "Small Hours", publisher: "Small Hours Co.", initials: "SH", category: "Lifestyle", format: "Podcast", price: 650, audience: "31k", detail: "Conversations on making a life outside the lines.", image: "photo-1470225620780-dba8ba36b745", tone: "#dccfc3" },
      { name: "Field Notes", publisher: "Field Notes Journal", initials: "FN", category: "Travel", format: "Website", price: 890, audience: "76k", detail: "Slow travel guides for curious, considerate explorers.", image: "photo-1470770841072-f978cf4d019e", tone: "#d9e3dd" },
      { name: "Good Company", publisher: "Common Ground", initials: "GC", category: "Business", format: "Newsletter", price: 320, audience: "24k", detail: "A brighter take on building businesses that matter.", image: "photo-1524758631624-e2822e304c36", tone: "#e3dbcf" },
      { name: "Sunday Run Club", publisher: "SRC Community", initials: "SR", category: "Wellness", format: "Social", price: 540, audience: "58k", detail: "A city-wide running community showing up every Sunday.", image: "photo-1530549387789-4c1017266635", tone: "#d3ddd4" },
      { name: "The Good Edit", publisher: "Good Edit Studio", initials: "GE", category: "Lifestyle", format: "Newsletter", price: 410, audience: "35k", detail: "A weekly edit of useful things, made to last.", image: "photo-1490481651871-ab68de25d43d", tone: "#e4d7cc" },
      { name: "Creative Current", publisher: "Current Works", initials: "CW", category: "Design", format: "Podcast", price: 720, audience: "28k", detail: "Fresh perspectives from independent creative leaders.", image: "photo-1455390582262-044cdead277a", tone: "#d4dfe3" },
      { name: "Market Day", publisher: "Market Day Media", initials: "MD", category: "Food & Drink", format: "Social", price: 275, audience: "19k", detail: "Local makers, seasonal recipes, and a good market haul.", image: "photo-1542838132-92c53300491e", tone: "#e0dfc8" }
    ];
    const categories = ["All spaces", "Design", "Food & Drink", "Lifestyle", "Travel", "Business", "Wellness"];
    let role = "buyer";
    let activeCategory = "All spaces";
    let activePage = "Discover";
      let campaigns = JSON.parse(localStorage.getItem("adspace-campaigns") || "[]");
      let customPlacements = JSON.parse(localStorage.getItem("adspace-placements") || "[]");
    let saved = new Set(JSON.parse(localStorage.getItem("adspace-saved") || "[]"));

    const metrics = {
      buyer: [["Active campaigns", "03", "+1 this month", "▤"], ["Total reach", "186k", "+12.4%", "◉"], ["Avg. engagement", "4.8%", "+0.6%", "↗"], ["Budget remaining", "$4,280", "of $8,000", "$" ]],
      seller: [["Active placements", "08", "+2 this month", "▤"], ["Monthly reach", "124k", "+18.2%", "◉"], ["Avg. fill rate", "76%", "+8.1%", "↗"], ["This month", "$3,840", "+14.6%", "$" ]]
    };
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));

    function renderStats() {
      $("#stats").innerHTML = metrics[role].map(([label, value, change, icon]) => `<article class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><span class="change">${change}</span></article>`).join("");
    }
    function renderCategories() {
      $("#categories").innerHTML = categories.map((category) => `<button class="chip ${activeCategory === category ? "active" : ""}" data-category="${category}">${category}</button>`).join("");
      $("#categories").querySelectorAll("button").forEach((button) => button.addEventListener("click", () => { activeCategory = button.dataset.category; renderCategories(); renderListings(); }));
    }
    function renderListings() {
      const query = $("#search").value.trim().toLowerCase();
      if (activePage === "Campaigns") {
        const visibleCampaigns = campaigns.filter((campaign) => campaign.name.toLowerCase().includes(query));
        $("#listings").innerHTML = visibleCampaigns.length ? visibleCampaigns.map((campaign) => `<article class="listing"><div class="listing-body"><span class="tag" style="position:static;display:inline-block">${escapeHtml(campaign.format)}</span><h3>${escapeHtml(campaign.name)}</h3><p class="listing-desc">Campaign draft</p><div class="listing-meta"><span><small>Budget</small><strong>$${Number(campaign.budget).toLocaleString()}</strong></span><span class="audience"><small>Status</small><strong>Draft</strong></span></div></div></article>`).join("") : `<div class="empty">No campaigns yet. Create one to start finding the right audience.</div>`;
        return;
      }
      let results = [...placements, ...customPlacements].filter((item) => (activeCategory === "All spaces" || item.category === activeCategory) && (($('#format').value === "all") || item.format === $('#format').value) && [item.name, item.publisher, item.category, item.format, item.detail].some((value) => value.toLowerCase().includes(query)));
      if (activePage === "Saved") results = results.filter((item) => saved.has(item.name));
      if (activePage !== "Discover" && activePage !== "Saved") results = [];
      if ($("#sort").value === "price-low") results.sort((a, b) => a.price - b.price);
      if ($("#sort").value === "audience-high") results.sort((a, b) => parseInt(b.audience) - parseInt(a.audience));
      if (!results.length) { $("#listings").innerHTML = `<div class="empty">${activePage === "Saved" ? "Your saved placements will show up here." : activePage !== "Discover" ? `${activePage} overview is coming soon.` : "No placements match those filters. Try another search."}</div>`; return; }
      $("#listings").innerHTML = results.map((item) => `<article class="listing"><div class="listing-image" style="background:${item.tone}"><img src="https://images.unsplash.com/${item.image}?auto=format&fit=crop&w=720&q=80" alt="${escapeHtml(item.name)} publication setting" loading="lazy"><span class="tag">${escapeHtml(item.format)}</span><button class="save ${saved.has(item.name) ? "saved" : ""}" data-save="${escapeHtml(item.name)}" aria-label="${saved.has(item.name) ? "Remove saved placement" : "Save placement"}" title="Save placement">${saved.has(item.name) ? "♥" : "♡"}</button></div><div class="listing-body"><div class="publisher"><span class="avatar">${escapeHtml(item.initials)}</span>${escapeHtml(item.publisher)} <span>·</span> ${escapeHtml(item.category)}</div><h3>${escapeHtml(item.name)}</h3><p class="listing-desc">${escapeHtml(item.detail)}</p><div class="listing-meta"><span><small>Starting at</small><strong>$${item.price.toLocaleString()} <small style="display:inline">/ placement</small></strong></span><span class="audience"><small>Monthly audience</small><strong>${escapeHtml(item.audience)} readers</strong></span></div></div></article>`).join("");
      $("#listings").querySelectorAll("[data-save]").forEach((button) => button.addEventListener("click", () => { const name = button.dataset.save; saved.has(name) ? saved.delete(name) : saved.add(name); localStorage.setItem("adspace-saved", JSON.stringify([...saved])); renderListings(); toast(saved.has(name) ? "Placement saved" : "Removed from saved"); }));
    }
    function toast(message) {
      document.querySelector(".toast")?.remove();
      const node = document.createElement("div"); node.className = "toast"; node.textContent = message; document.body.append(node); setTimeout(() => node.remove(), 2400);
    }
    function openForm() {
      const seller = role === "seller";
      const overlay = document.createElement("div"); overlay.className = "modal-backdrop";
      overlay.innerHTML = `<form class="modal"><div class="modal-head"><div><h2>${seller ? "List a placement" : "Start a campaign"}</h2><p>${seller ? "Introduce your audience to the right brands." : "Tell us what you want to get in front of."}</p></div><button class="close" type="button" aria-label="Close">×</button></div><div class="field"><label for="form-name">${seller ? "Placement name" : "Campaign name"}</label><input id="form-name" required placeholder="e.g. Spring launch"></div><div class="field"><label for="form-format">${seller ? "Ad format" : "Placement type"}</label><select id="form-format"><option>Newsletter</option><option>Podcast</option><option>Website</option><option>Social</option></select></div>${seller ? `<div class="field"><label for="form-audience">Monthly audience</label><input id="form-audience" type="number" min="1" required placeholder="25000"></div>` : ""}<div class="field"><label for="form-budget">${seller ? "Starting price (USD)" : "Campaign budget (USD)"}</label><input id="form-budget" type="number" min="1" required placeholder="500"></div><div class="modal-actions"><button class="secondary" type="button" data-cancel>Cancel</button><button class="primary" type="submit">${seller ? "Save placement" : "Create campaign"}</button></div></form>`;
      $("#overlay-root").append(overlay);
      const close = () => overlay.remove();
      overlay.querySelector(".close").addEventListener("click", close);
      overlay.querySelector("[data-cancel]").addEventListener("click", close);
      overlay.addEventListener("click", (event) => { if (event.target === overlay) close(); });
      overlay.querySelector("form").addEventListener("submit", (event) => {
        event.preventDefault();
        const name = overlay.querySelector("#form-name").value.trim();
        const format = overlay.querySelector("#form-format").value;
        const budget = Number(overlay.querySelector("#form-budget").value);
        if (seller) {
          const audience = Number(overlay.querySelector("#form-audience").value);
          customPlacements.push({ name, publisher: "Jordan Miller", initials: "JM", category: "Business", format, price: budget, audience: audience >= 1000 ? `${Math.round(audience / 100) / 10}k` : String(audience), detail: "A new placement from your publisher profile.", image: "photo-1516321318423-f06f85e504b3", tone: "#d8e2d5" });
          localStorage.setItem("adspace-placements", JSON.stringify(customPlacements));
          activePage = "Discover";
        } else {
          campaigns.unshift({ name, format, budget });
          localStorage.setItem("adspace-campaigns", JSON.stringify(campaigns));
          $(".nav-count").textContent = campaigns.length;
          activePage = "Campaigns";
          document.querySelectorAll(".nav button").forEach((button) => button.classList.toggle("active", button.dataset.page === activePage));
        }
        close();
        renderListings();
        toast(`${seller ? "Placement" : "Campaign"} “${name}” created`);
      });
      overlay.querySelector("#form-name").focus();
    }
    function setRole(nextRole) {
      role = nextRole;
      document.querySelectorAll("[data-role]").forEach((button) => { button.classList.toggle("active", button.dataset.role === role); button.setAttribute("aria-pressed", button.dataset.role === role); });
      $("#welcome-title").textContent = role === "buyer" ? "Find your next audience." : "Make room for good brands.";
      $("#welcome-copy").textContent = role === "buyer" ? "Thoughtful placements for brands with something to say." : "Put your community in front of brands that get it.";
      $("#primary-action").lastElementChild.textContent = role === "buyer" ? "New campaign" : "List a placement";
      $("#section-title").textContent = role === "buyer" ? "Spaces worth your spend" : "Your community, valued";
      $("#section-sub").textContent = role === "buyer" ? "Independent publishers, real communities, clear pricing." : "Discover what great publishers are offering to brands.";
      renderStats();
    }
    document.querySelectorAll("[data-role]").forEach((button) => button.addEventListener("click", () => setRole(button.dataset.role)));
    document.querySelectorAll(".nav button").forEach((button) => button.addEventListener("click", () => {
      activePage = button.dataset.page;
      document.querySelectorAll(".nav button").forEach((navButton) => navButton.classList.toggle("active", navButton === button));
      $("#section-title").textContent = activePage === "Discover" ? (role === "buyer" ? "Spaces worth your spend" : "Your community, valued") : activePage;
      $("#section-sub").textContent = activePage === "Discover" ? "Independent publishers, real communities, clear pricing." : activePage === "Saved" ? "The placements you bookmarked for later." : `Your ${activePage.toLowerCase()} at a glance.`;
      renderListings();
    }));
    $("#welcome-kicker").textContent = new Intl.DateTimeFormat("en", { weekday: "long", month: "long", day: "numeric" }).format(new Date()).toUpperCase();
    $("#primary-action").addEventListener("click", openForm);
    $("#view-all").addEventListener("click", () => { activeCategory = "All spaces"; $("#search").value = ""; $("#format").value = "all"; renderCategories(); renderListings(); });
    $("#search").addEventListener("input", renderListings);
    $("#sort").addEventListener("change", renderListings);
    $("#format").addEventListener("change", renderListings);
    renderStats(); renderCategories(); renderListings();
  </script>
</body>
</html>
